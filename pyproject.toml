[project]
name = "bio-corgi"
version = "0.5.8"
description = "Classifier for ORganelle Genomes Inter alia"
authors = [{name = "Robert Turnbull", email = "robert.turnbull@unimelb.edu.au"}]
license = "Apache-2.0"
readme = "README.rst"
requires-python = ">=3.11,<3.15"
keywords = ["metagenomic classifier", "tiara", "DNA", "bioinformatics", "lightning", "pytorch", "deep learning", "command-line interface"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "torchapp>=0.5.9",
    "numpy<2.0.0",
    "biopython>=1.79",
    "humanize>=3.10.0",
    "pyarrow>=5.0.0",
    "plotly>=5.3.1",
    "appdirs>=1.4.4",
    "beautifulsoup4>=4.10.0",
    "httpx>=0.20.0",
    "cryptography>=36.0.1",
    "PyMySQL>=1.0.2",
    "termgraph>=0.5.3",
    "torch>=2.0.0",
    "hierarchicalsoftmax>=1.4.1",
    "attrs>=23.1.0",
    "polytorch>=0.1.3",
    "seqbank>=0.2.0",
    "multitax>=1.3.1",
]

[project.optional-dependencies]
images = ["kaleido>=1.0"]

[project.urls]
Homepage = "https://github.com/rbturnbull/corgi"
Repository = "https://github.com/rbturnbull/corgi"
Documentation = "https://rbturnbull.github.io/corgi/"

[project.scripts]
corgi = "corgi.apps:Corgi.main"
corgi-tools = "corgi.apps:Corgi.tools"
seqtree = "corgi.seqtree:app"
refseq-to-seqtree = "corgi.refseq:app"

[dependency-groups]
dev = [
    "pytest>=6.2.5",
    "ipykernel>=6.6.1",
    "coverage>=5.5",
    "autopep8>=1.5.7",
    "Sphinx>=5.0.0",
    "nbsphinx>=0.8.7",
    "sphinx-rtd-theme>=1.0.0",
    "sphinx-autobuild>=2021.3.14",
    "pre-commit>=2.20.0",
    "sphinx-copybutton>=0.4.0",
    "scipy>=1.10.1",
    "black>=21.10b0",
    "sphinx-click",
]

[tool.uv.sources]
sphinx-click = {git = "https://github.com/rbturnbull/sphinx-click.git"}

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "corgi"
module-root = ""

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
]

[tool.black]
line-length = 120
skip_string_normalization = true
