
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false
    
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.2
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
    - name: Install dependencies for Python ${{ matrix.python-version }}
      run: uv sync --locked
    - name: Docs
      run: |
        uv run sphinx-build -b html docs gh-pages
    - name: Coverage
      run: |
        uv run coverage run -m pytest
        echo "COVERAGE=$(uv run coverage report --precision 2 | grep TOTAL | tr -s ' ' | cut -f 4 -d " ")" >> $GITHUB_ENV
        uv run coverage html --directory gh-pages/coverage
    - name: Deploy 🚀
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: gh-pages # The branch the action should deploy to.
        folder: gh-pages # The folder the action should deploy.
    
    - name: Create Coverage Badge
      uses: schneegans/dynamic-badges-action@v1.9.0
      with:
        auth: ${{ secrets.GIST_SECRET }}
        gistID: ee1b52dd314d6441e0aabc0e1e50dc2c
        filename: coverage-badge.json
        label: coverage
        message: ${{ env.COVERAGE }}
        color: green
    